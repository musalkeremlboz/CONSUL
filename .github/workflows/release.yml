name: Release

# `v*` etiketi itildiğinde üç platform için kurulum paketleri üretir, taslak
# bir GitHub Release'e yükler, SHA256 sağlamalarını ekler ve yayını açar.
#
# İmzalama: sertifika secret'ları TANIMLIYSA kullanılır, değilse build imzasız
# devam eder (sahte imzalama yapılmaz — bkz. docs/SIGNING.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    name: Paket · ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
          - os: ubuntu-latest
            script: package:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Kimlik bilgileri YALNIZ gerçekten tanımlıysa ortama yazılır.
      # BOŞ ama TANIMLI bir `CSC_LINK`, electron-builder tarafından "sertifika
      # yolu" sayılır ve macOS derlemesi `⨯ … not a file` ile düşer. Sertifika
      # yokken imzalama otomatik keşfi de kapatılır (bkz. docs/SIGNING.md).
      - name: İmzalama kimlik bilgilerini hazırla
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=0
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=1
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=1
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
              echo "Notarization: etkin"
            fi
          fi
          if [ "$signed" = "1" ]; then
            echo "İmzalama: sertifika bulundu, imzalı derleme"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "İmzalama: sertifika yok — imzasız derleme (docs/SIGNING.md)"
          fi

      - name: Paketle ve taslak yayına yükle
        run: npx electron-vite build && npx electron-builder --${{ startsWith(matrix.os, 'windows') && 'win' || startsWith(matrix.os, 'macos') && 'mac' || 'linux' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Sağlamalar ve yayın
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayın varlıklarını indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets --pattern '*' --clobber

      - name: SHA256 üret
        working-directory: assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sağlamaları yükle ve yayını aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" assets/SHA256SUMS.txt --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
